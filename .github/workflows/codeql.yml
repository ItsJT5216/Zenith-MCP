# CodeQL — GitHub's static security analysis. Results appear under
# Security → Code scanning and as review comments on pull requests.
#
# Languages analysed are the ones this repo actually contains:
#   javascript-typescript  packages/*/src and the vitest/node:test files
#   python                 the test harnesses under packages/zenith-mcp/tests
#   actions                the workflow files themselves (catches missing
#                          `permissions:`, script injection via ${{ }} in run:, …)
#
# NOTE: if "Default setup" is also switched on under Settings → Code security →
# Code scanning, the same languages get analysed twice. Keep one: either turn
# default setup off and keep this file, or delete this file. README-CI.md has
# the details.
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so newly published queries re-check main even without pushes.
    - cron: "15 7 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload results to the Security tab.
      security-events: write
      # Fetch CodeQL packs / read the run status.
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - '**/dist/**'
              - '**/coverage/**'
              - '**/node_modules/**'
              - '**/tests/_legacy_old_arch/**'
              - '**/_legacy_old_arch/**'
              - 'test-results/**'
              - '**/*.junit.xml'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
