name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version auto-detected from the packageManager field in root package.json
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned to engines.node in packages/zenith-mcp/package.json
          node-version: "26.3.0"
          cache: "pnpm"

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Builds zenith-toon first (workspace dep), then zenith-mcp.
        # tsc --build also performs full type-checking — no separate typecheck step needed.
        run: pnpm build

      - name: Test (with coverage)
        # Tests import from dist/, so build must precede this step.
        # vitest.config.ts (packages/zenith-mcp) configures the v8 coverage
        # provider with the cobertura reporter used below.
        run: pnpm --filter zenith-mcp run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: packages/zenith-mcp/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-typescript
          path: packages/zenith-mcp/coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
