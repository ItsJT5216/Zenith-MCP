name: Release Readiness

# Release automation is in publish.yml. This verifies package contents,
# without the old broken Changesets bot or credentialed publishing on pushes.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and inspect one npm archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run test:toon
      - run: node scripts/stage-npm-package.mjs
      - run: pnpm run release:verify
