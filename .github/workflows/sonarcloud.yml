name: SonarCloud analysis

on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Require authorized analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Fork PR analysis requires an authorized trusted revision; this workflow cannot give a fork analysis credentials."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is unavailable. Configure an analysis token for this execution context; Dependabot runs require a same-name Dependabot secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        # Version comes from packageManager in the root manifest.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.3.0"
          cache: pnpm

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test TOON constraints
        run: pnpm test:toon

      - name: Test with coverage
        run: pnpm --filter zenith-mcp run test:coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Resolve coverage source paths
        # Vitest writes SF paths relative to its package; the scan uses the repo root.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const repoRoot = process.cwd();
          const packageRoot = path.join(repoRoot, 'packages/zenith-mcp');
          const reportPath = path.join(packageRoot, 'coverage/lcov.info');
          let sourceFiles = 0;
          const report = fs.readFileSync(reportPath, 'utf8')
            .split(/\r?\n/)
            .map(line => {
              if (!line.startsWith('SF:')) return line;
              const sourcePath = path.resolve(packageRoot, line.slice(3));
              const repoPath = path.relative(repoRoot, sourcePath);
              if (repoPath === '..' || repoPath.startsWith(`..${path.sep}`) ||
                  path.isAbsolute(repoPath) || !fs.statSync(sourcePath).isFile()) {
                throw new Error('LCOV source does not resolve to a repository file: ' + line.slice(3));
              }
              sourceFiles += 1;
              return 'SF:' + repoPath.split(path.sep).join('/');
            })
            .join('\n');
          if (sourceFiles === 0) throw new Error('LCOV report contains no source files');
          fs.writeFileSync(reportPath, report);
          console.log('Resolved ' + sourceFiles + ' LCOV source paths');
          NODE

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .
          args: >-
            -Dsonar.projectKey=itstanner5216_Zenith-MCP
            -Dsonar.organization=itstanner5216
            -Dsonar.sources=packages/zenith-mcp/src,packages/zenith-toon/src
            -Dsonar.tests=packages/zenith-mcp/tests,packages/zenith-toon/tests
            -Dsonar.javascript.lcov.reportPaths=packages/zenith-mcp/coverage/lcov.info
