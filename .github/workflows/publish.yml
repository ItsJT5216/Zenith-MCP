name: Publish Zenith-MCP

# Exactly one public npm package; TOON is bundled inside zenith-mcp.
# Authenticate with an npm trusted publisher (OIDC) or NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Stage under next, or release under latest"
        type: choice
        required: true
        default: stage
        options:
          - stage
          - production
      dry_run:
        description: "Preview npm publish without uploading"
        type: boolean
        required: true
        default: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-zenith-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish one Zenith-MCP archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        # Auto-detect pnpm version from root packageManager, no competing pin.
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Enable current npm OIDC dist-tag support
        run: npm install --global npm@12.2.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test both internal workspaces
        run: |
          pnpm run test
          pnpm run test:toon
      - name: Prepare single-package archive
        run: node scripts/stage-npm-package.mjs
      - name: Verify clean npm install
        run: pnpm run release:verify
      - name: Publish or preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            MODE=production
            DRY_RUN=false
            TAG_NAME=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).release.tag_name")
            PACKAGE_VERSION=$(node -p "require('./packages/zenith-mcp/package.json').version")
            if [ "$TAG_NAME" != "$PACKAGE_VERSION" ] && [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
              echo "Release tag must match npm version ($PACKAGE_VERSION or v$PACKAGE_VERSION)." >&2
              exit 1
            fi
          else
            MODE=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).inputs.mode")
            DRY_RUN=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).inputs.dry_run")
          fi
          case "$MODE" in
            production) DIST_TAG=latest ;;
            stage) DIST_TAG=next ;;
            *) echo "Unexpected publish mode: $MODE" >&2; exit 1 ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/publish-npm-package.mjs --tag "$DIST_TAG" --dry-run
          else
            node scripts/publish-npm-package.mjs --tag "$DIST_TAG"
          fi
